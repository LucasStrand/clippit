<!DOCTYPE html>
<html dir="ltr" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ui.css">
    <style>.clippit-logo{width:64px;height:64px;image-rendering:pixelated}.clippit-name{font-weight:bold;font-size:15px;margin:4px 0 8px}.off .sitepart{opacity:.4;pointer-events:none}</style>
</head>

<body class="popup">
    <div class="pane fronttab">
        <img src="logo.png" class="clippit-logo" alt="">
        <div class="clippit-name">Clippit Says No</div>
        <div class="pane">
            <div class="keeprunning">
                <label class="siteselector clippit-master"><input type="checkbox" id="enabled"><span>Say no to cookie popups</span></label>
            </div>
            <div class="keeprunning sitepart">
                <div>[[KEEP_RUNNING]]</div>
                <label class="siteselector"><input type="checkbox" checked><span id="site"></span></label>
            </div>
            <div>
                <button id="settings">[[MORE_ADDON_SETTINGS]]</button>
            </div>
        </div>
    </div>
    <script src="ui.js"></script>
</body>

</html>
